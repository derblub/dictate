name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The steps of scripts/check.sh that need neither a GPU nor a Wayland session. Arch Linux, because dictate-ui needs
# GTK 4.24 and gtk4-layer-shell 1.3. The runner has no GPU: whisper.cpp is built for one fixed CUDA architecture, and
# no test outside `--ignored` initializes CUDA.
env:
  CUDA_PATH: /opt/cuda
  CMAKE_CUDA_ARCHITECTURES: "86"

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: arch-lint-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: arch-lint-
      - run: scripts/ci-setup-arch.sh
      - run: echo /opt/cuda/bin >> "$GITHUB_PATH"
      - run: scripts/check.sh --only fmt
      - run: scripts/check.sh --only licenses
      - run: scripts/check.sh --only clippy

  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: arch-test-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: arch-test-
      - run: scripts/ci-setup-arch.sh
      - run: echo /opt/cuda/bin >> "$GITHUB_PATH"
      - run: scripts/check.sh --only unit
