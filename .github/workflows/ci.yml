name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The steps of scripts/check.sh that need neither a GPU nor a Wayland session: fmt, licenses, clippy and the mock
  # tests. Arch Linux, because dictate-ui needs GTK 4.24 and gtk4-layer-shell 1.3. The runner has no GPU: whisper.cpp
  # is built for one fixed CUDA architecture, and no test outside `--ignored` initializes CUDA.
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 120
    env:
      CUDA_PATH: /opt/cuda
      CMAKE_CUDA_ARCHITECTURES: "86"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: arch-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: arch-cargo-
      - name: Install packages and toolchain
        run: |
          echo /opt/cuda/bin >> "$GITHUB_PATH"
          scripts/ci-setup-arch.sh
      - name: fmt, licenses, clippy, unit
        run: scripts/check.sh --only fmt,licenses,clippy,unit
