[package]
name = "dictate"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Local live dictation for niri on Wayland (whisper.cpp, CUDA)"

[lib]
name = "dictate"
path = "src/lib.rs"

[[bin]]
name = "dictate"
path = "src/main.rs"

[[bin]]
name = "dictate-settings"
path = "src/bin/dictate-settings.rs"
required-features = ["gui"]

# Wayland-Oberfläche (PLAN-wayland.md): Overlay, Halten zum Sprechen, später Panels und Ausgabe. Schlank wie
# früher dictate-palette (Module per Pfad, ohne Whisper/CUDA), GTK 4 und gtk4-layer-shell aus dem System
[[bin]]
name = "dictate-ui"
path = "src/bin/dictate-ui/main.rs"
required-features = ["ui"]

[features]
default = ["gui", "ui"]
gui = ["dep:eframe", "dep:egui", "dep:sha2", "dep:image", "dep:skrifa"]
ui = ["dep:gtk", "dep:gtk4-layer-shell", "dep:async-channel", "dep:niri-ipc", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-misc"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
toml_edit = { version = "0.25", features = ["serde"] }
serde_path_to_error = "0.1"
hound = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
whisper-rs = { version = "0.16", features = ["cuda", "tracing_backend"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"
signal-hook = "0.4"
# Ohne `default_fonts` (U2, PLAN-lizenz.md): keine Schrift von egui im Binary (Hack, Ubuntu Light, Icons), das Fenster
# lädt seine Schriften vom System (src/gui/fonts.rs, theme::install)
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "wayland", "clipboard"] }
egui = { version = "0.37", optional = true, default-features = false }
# Schriftdateien vor dem Laden prüfen (egui bricht mit panic ab, wenn sich eine Datei nicht lesen lässt; Lesart L41 in
# PLAN-wayland.md 6h): dieselbe Version wie in epaint, steht über egui ohnehin im Lockfile
skrifa = { version = "0.50", optional = true, default-features = false, features = ["std"] }
url = "2"
# Graphem-Grenzen für gestreamte KI-Antworten (steht über egui ohnehin im Lockfile)
unicode-segmentation = "1"
# Eigener HTTP/1.1-Client (src/http.rs): TLS über rustls (*ring*, TLS 1.2/1.3) mit den Mozilla-Wurzeln aus
# webpki-roots, Antwortkopf über httparse, abbrechbarer Verbindungsaufbau über socket2 + poll(2) aus libc
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
httparse = "1"
socket2 = "0.6"
libc = "0.2"
sha2 = { version = "0.11", optional = true }
# dictate-ui (Feature `ui`): System-GTK 4.24 und gtk4-layer-shell 1.3 (wie Spike S4, `spikes/wayland-gtk`)
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_24"], optional = true }
gtk4-layer-shell = { version = "0.8.1", features = ["v1_3"], optional = true }
async-channel = { version = "2", optional = true }
# Textausgabe von dictate-ui (W2): eigene Wayland-Verbindung im Ausgabe-Thread für die virtuelle Tastatur
# (zwp_virtual_keyboard_v1), die Eingabemethode (zwp_input_method_v2) und die Zwischenablage (ext_data_control_v1);
# Versionen wie in den Spikes S2/S3 (stehen über eframe/winit ohnehin im Lockfile). niri-ipc exakt auf die niri-Version
# gepinnt (wie niri-coach): fokussiertes Fenster für Terminal-Erkennung und Profil
niri-ipc = { version = "=26.4.0", optional = true }
wayland-client = { version = "=0.31.15", optional = true }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"], optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[dev-dependencies]
# Offline-TLS-Tests des HTTP-Clients: eigene Test-CA und Serverzertifikate (src/http.rs)
rcgen = "0.14"
# Prüfsumme der Wortliste (src/actions/wordlist.rs); als Abhängigkeit nur mit dem Feature `gui`
sha2 = "0.11"
# Echte Schriftbytes für die Tests der Schriftprüfung (src/gui/fonts.rs, theme.rs); nur Testbau, das Binary bleibt ohne
# `default_fonts` (eine Test-Abhängigkeit schaltet das Feature von epaint nicht ein)
epaint_default_fonts = "0.37"

[profile.release]
opt-level = 3
lto = "thin"

# Weniger Debuginfo im Testbau: Zeilentabellen reichen für Backtraces mit Datei und Zeile, Abhängigkeiten ohne
# Debuginfo. Spart Platz in target/ (Release-Build des Dienstes unverändert).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
