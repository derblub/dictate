[package]
name = "nested-inject"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Physische Tastatur/Maus für verschachteltes niri in Tests (virtuelles Gerät auf dem kopflosen sway); Prüfschritt wayland"

# Eigener Workspace: nicht Teil von dictate.
[workspace]

[[bin]]
name = "nested-inject"
path = "src/main.rs"

# Zwischenablage im verschachtelten niri (aus Spike S3, spikes/wayland-paste): Auswahl mit vielen Typen anbieten,
# sichern, beobachten wie ein Verlauf; für die Prüfungen des Einfügens in tests/wayland/run.sh
[[bin]]
name = "nested-clip"
path = "src/clip.rs"

[dependencies]
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
